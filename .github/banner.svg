<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="bannerTitle">
  <title id="bannerTitle">Notchpad 横幅:收起为屏幕顶部药丸、悬浮展开的富文本便签应用</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#4ade80" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 编辑器面板阴影 -->
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#ambient)"/>

  <!-- 细网格 -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.025">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="120" y1="0" x2="120" y2="600"/>
    <line x1="240" y1="0" x2="240" y2="600"/>
    <line x1="360" y1="0" x2="360" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>
    <line x1="840" y1="0" x2="840" y2="600"/>
    <line x1="960" y1="0" x2="960" y2="600"/>
    <line x1="1080" y1="0" x2="1080" y2="600"/>
  </g>

  <!-- ======== 左侧:标题与文案 ======== -->
  <g>
    <text x="80" y="212" font-family="system-ui, 'Segoe UI', sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2.5">Notchpad</text>
    <text x="82" y="262" font-family="system-ui, 'Segoe UI', sans-serif" font-size="24" fill="#9a9a9e" letter-spacing="0.5">住在屏幕刘海里的桌面便签</text>

    <!-- 三个特性条目 -->
    <g font-family="system-ui, 'Segoe UI', sans-serif" font-size="17">
      <!-- 条目 1:刘海药丸 -->
      <g transform="translate(82, 316)">
        <rect x="0" y="0" width="44" height="26" rx="13" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80" stroke-opacity="0.45" stroke-width="1"/>
        <circle cx="14" cy="13" r="3" fill="#4ade80" opacity="0.85"/>
        <rect x="22" y="10.5" width="16" height="5" rx="2.5" fill="#4ade80" opacity="0.55"/>
        <text x="56" y="19" fill="#d4d4d8">灵动刘海 · 悬浮即展开</text>
      </g>
      <!-- 条目 2:药丸轮播 -->
      <g transform="translate(82, 358)">
        <rect x="0" y="0" width="52" height="26" rx="13" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80" stroke-opacity="0.45" stroke-width="1"/>
        <text x="26" y="18" fill="#4ade80" font-size="11" font-weight="600" text-anchor="middle">21°阴</text>
        <text x="64" y="19" fill="#d4d4d8">药丸轮播 · 时钟 / 一言 / 天气</text>
      </g>
      <!-- 条目 3:编辑器 -->
      <g transform="translate(82, 400)">
        <rect x="0" y="0" width="44" height="26" rx="13" fill="#4ade80" fill-opacity="0.14" stroke="#4ade80" stroke-opacity="0.45" stroke-width="1"/>
        <rect x="10" y="7" width="24" height="3.5" rx="1.75" fill="#4ade80" opacity="0.85"/>
        <rect x="10" y="15" width="16" height="3.5" rx="1.75" fill="#4ade80" opacity="0.5"/>
        <text x="56" y="19" fill="#d4d4d8">TipTap 富文本 · 自动保存落盘</text>
      </g>
    </g>

    <!-- 徽章行 -->
    <g font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="500">
      <rect x="82" y="456" width="112" height="30" rx="15" fill="#1a1a1c" stroke="#2e2e30" stroke-width="1"/>
      <text x="138" y="475" fill="#a3a3a8" text-anchor="middle">Tauri 2 · Rust</text>
      <rect x="204" y="456" width="86" height="30" rx="15" fill="#1a1a1c" stroke="#2e2e30" stroke-width="1"/>
      <text x="247" y="475" fill="#a3a3a8" text-anchor="middle">Vue 3.5</text>
      <rect x="300" y="456" width="106" height="30" rx="15" fill="#1a1a1c" stroke="#2e2e30" stroke-width="1"/>
      <text x="353" y="475" fill="#a3a3a8" text-anchor="middle">SQLite 本地</text>
      <rect x="416" y="456" width="102" height="30" rx="15" fill="#1a1a1c" stroke="#2e2e30" stroke-width="1"/>
      <text x="467" y="475" fill="#a3a3a8" text-anchor="middle">Windows NSIS</text>
    </g>
  </g>

  <!-- ======== 右侧:显示器 + 刘海应用 mockup ======== -->
  <g>
    <!-- 显示器外框 -->
    <g transform="translate(600, 128)">
      <rect x="6" y="14" width="520" height="330" rx="18" fill="#000000" opacity="0.55" filter="url(#panelShadow)"/>
      <rect x="0" y="0" width="520" height="330" rx="18" fill="#111113" stroke="#262628" stroke-width="1.5"/>
      <!-- 壁纸渐变 -->
      <clipPath id="screen"><rect x="3" y="3" width="514" height="324" rx="15"/></clipPath>
      <g clip-path="url(#screen)">
        <rect x="3" y="3" width="514" height="324" fill="#0c0c0e"/>
        <rect x="3" y="3" width="514" height="324" fill="url(#ambient)" opacity="0.6"/>
      </g>

      <!-- 展开态应用窗口:顶部齐平、底部圆角 -->
      <g transform="translate(75, 1)">
        <rect x="0" y="0" width="310" height="236" fill="#0f1014" stroke="#2e2e30" stroke-width="1"/>
        <clipPath id="win"><path d="M0,0 h310 v220 q0,16 -16,16 h-278 q-16,0 -16,-16 z"/></clipPath>
        <g clip-path="url(#win)">
          <rect x="0" y="0" width="310" height="236" fill="#0f1014"/>
          <!-- 顶部工具栏:胶囊页导航 -->
          <rect x="0" y="0" width="310" height="40" fill="#151516"/>
          <rect x="0" y="38" width="310" height="1" fill="#262628"/>
          <rect x="14" y="10" width="168" height="20" rx="7" fill="#1c1c1e"/>
          <!-- 页面圆点,当前页为长条 -->
          <circle cx="30" cy="20" r="4" fill="#555558"/>
          <rect x="42" y="15.5" width="22" height="9" rx="4.5" fill="url(#accent)"/>
          <circle cx="76" cy="20" r="4" fill="#555558"/>
          <circle cx="90" cy="20" r="4" fill="#555558"/>
          <circle cx="104" cy="20" r="4" fill="#555558"/>
          <!-- 加号 -->
          <line x1="136" y1="20" x2="148" y2="20" stroke="#5a5a5e" stroke-width="2" stroke-linecap="round"/>
          <line x1="142" y1="14" x2="142" y2="26" stroke="#5a5a5e" stroke-width="2" stroke-linecap="round"/>
          <!-- 搜索 + 设置 -->
          <circle cx="252" cy="20" r="6.5" stroke="#5a5a5e" stroke-width="1.6" fill="none"/>
          <line x1="256.8" y1="24.8" x2="261" y2="29" stroke="#5a5a5e" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="282" cy="20" r="6.5" stroke="#5a5a5e" stroke-width="1.6" fill="none"/>
          <circle cx="282" cy="20" r="2.4" stroke="#5a5a5e" stroke-width="1.4" fill="none"/>

          <!-- 编辑区内容:标题 + 富文本行 -->
          <rect x="22" y="58" width="130" height="11" rx="3" fill="#e5e5e5" opacity="0.75"/>
          <rect x="22" y="84" width="230" height="7" rx="2" fill="#e5e5e5" opacity="0.34"/>
          <rect x="22" y="100" width="204" height="7" rx="2" fill="#e5e5e5" opacity="0.24"/>
          <!-- 任务列表 -->
          <rect x="22" y="122" width="11" height="11" rx="3" fill="url(#accent)" opacity="0.9"/>
          <rect x="40" y="124" width="120" height="7" rx="2" fill="#e5e5e5" opacity="0.4"/>
          <rect x="22" y="142" width="11" height="11" rx="3" fill="none" stroke="#5a5a5e" stroke-width="1.4"/>
          <rect x="40" y="144" width="170" height="7" rx="2" fill="#e5e5e5" opacity="0.24"/>
          <!-- 引用块 -->
          <rect x="22" y="168" width="3" height="22" rx="1.5" fill="url(#accent)" opacity="0.8"/>
          <rect x="33" y="171" width="150" height="7" rx="2" fill="#e5e5e5" opacity="0.3"/>
          <rect x="33" y="184" width="110" height="7" rx="2" fill="#e5e5e5" opacity="0.2"/>
          <!-- 高亮词 -->
          <rect x="188" y="98" width="42" height="11" rx="2.5" fill="#4ade80" opacity="0.28"/>
          <!-- 光标 -->
          <rect x="158" y="82" width="2" height="13" rx="1" fill="#4ade80" opacity="0.9" filter="url(#glow)"/>

          <!-- 底部工具栏:格式按钮 + 保存状态 -->
          <rect x="0" y="200" width="310" height="36" fill="#161618"/>
          <rect x="0" y="200" width="310" height="1" fill="#262628"/>
          <g fill="#232325">
            <rect x="16" y="208" width="22" height="20" rx="5"/>
            <rect x="44" y="208" width="22" height="20" rx="5"/>
            <rect x="72" y="208" width="22" height="20" rx="5"/>
            <rect x="100" y="208" width="22" height="20" rx="5"/>
            <rect x="128" y="208" width="22" height="20" rx="5"/>
          </g>
          <text x="27" y="222" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#6a6a6e" text-anchor="middle">B</text>
          <text x="55" y="222" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#6a6a6e" text-anchor="middle">I</text>
          <text x="83" y="222" font-family="Georgia, serif" font-size="12" fill="#6a6a6e" text-anchor="middle" text-decoration="line-through">S</text>
          <rect x="108" y="213" width="10" height="10" rx="2" fill="none" stroke="#6a6a6e" stroke-width="1.3"/>
          <text x="139" y="222" font-family="system-ui" font-size="11" fill="#6a6a6e" text-anchor="middle">H1</text>
          <!-- 已保存指示 -->
          <circle cx="242" cy="218" r="2.5" fill="#4ade80" opacity="0.9"/>
          <rect x="250" y="215" width="34" height="6" rx="3" fill="#e5e5e5" opacity="0.3"/>
          <!-- 字数 -->
          <rect x="20" y="188" width="90" height="0" fill="none"/>
        </g>
        <!-- 底部圆角描边补全 -->
        <path d="M0,0 h310 v220 q0,16 -16,16 h-278 q-16,0 -16,-16 z" fill="none" stroke="#2e2e30" stroke-width="1"/>
      </g>

      <!-- 收起态药丸:悬停在屏幕顶缘,带投影 -->
      <g transform="translate(402, 6)">
        <rect x="-6" y="-8" width="112" height="34" rx="16" fill="#4ade80" opacity="0.18" filter="url(#soft)"/>
        <g filter="url(#glow)">
          <path d="M0,0 h96 q0,16 -12,16 h-72 q-12,0 -12,-16 z" fill="#17181a" stroke="#3a3a3c" stroke-width="1"/>
        </g>
        <!-- 药丸内文字:天气+时钟 -->
        <text x="30" y="12" font-family="system-ui, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#4ade80" text-anchor="middle">21°</text>
        <text x="47" y="12" font-family="system-ui, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#4ade80" text-anchor="middle">阴</text>
        <rect x="56" y="4.5" width="1" height="9" fill="#3a3a3c"/>
        <text x="74" y="12" font-family="system-ui, 'Segoe UI', sans-serif" font-size="9.5" fill="#a3a3a8" text-anchor="middle">15:47</text>
      </g>

      <!-- 悬浮光标,指向药丸 -->
      <g transform="translate(444, 46)">
        <path d="M0,0 L0,16 L4.6,12.2 L7.6,18.4 L10.6,16.9 L7.7,10.9 L13,10.4 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
      </g>
    </g>

    <!-- 显示器底座 -->
    <rect x="824" y="468" width="72" height="10" rx="5" fill="#1a1a1c" stroke="#2e2e30" stroke-width="1"/>
    <rect x="846" y="458" width="28" height="12" fill="#161618"/>
  </g>

  <!-- 底部一行小注 -->
  <text x="600" y="556" font-family="system-ui, 'Segoe UI', sans-serif" font-size="15" fill="#6b6b70" text-anchor="middle" letter-spacing="1">悬浮药丸即展开 · 收起即归位 · 一切都在本地</text>
</svg>
